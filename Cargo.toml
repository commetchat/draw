[package]
name = "draw-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.16.1", default-features = false, features = ["bevy_gizmos", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_log", "bevy_render", "bevy_scene", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_window", "bevy_winit", "png", "webgl2", "default_font", "bevy_pbr"]}
bevy_embedded_assets = "0.13.0"
binary-util = "0.3.4"
bincode = "2.0.1"
binreader = "0.2.1"
bytes = "1.10.1"
iyes_perf_ui = "0.5.0"
js-sys = "0.3.77"
safe-transmute = "0.11.3"
serde = { version = "1.0.219", features = ["alloc", "derive"] }
serde_json = "1.0.141"
ts-rs = "11.0.1"
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["Document", "Element", "HtmlElement", "PointerEvent", "Window", "DomRect"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
rand = "0.9.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
lto = "thin"
